<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img"><title>Ye1 科研流程原创示意</title><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07101f"/><stop offset="1" stop-color="#132442"/></linearGradient><pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M 40 0 L 0 0 0 40" fill="none" stroke="#233b57" stroke-width="0.7" opacity="0.4"/></pattern></defs><rect width="1200" height="620" rx="20" fill="url(#bg)"/><rect width="1200" height="620" rx="20" fill="url(#grid)"/><g font-family="PingFang SC,Noto Sans CJK SC,sans-serif"><text x="50" y="76" font-size="52" fill="#f6f9ff" font-weight="700">两条路径，同一条科研主线</text><text x="50" y="147" font-size="27" fill="#50e0cf" font-weight="650">已有数据</text><rect x="50" y="167" width="255" height="78" rx="12" fill="#12243b" stroke="#50e0cf" stroke-opacity="0.6"/><text x="70" y="217" font-size="32" fill="#eaf3ff" font-weight="500">数据与目标</text><path d="M310 206h15m-6-6 6 6-6 6" fill="none" stroke="#50e0cf" stroke-width="2"/><rect x="330" y="167" width="255" height="78" rx="12" fill="#12243b" stroke="#50e0cf" stroke-opacity="0.6"/><text x="350" y="217" font-size="32" fill="#eaf3ff" font-weight="500">质控和方案</text><path d="M590 206h15m-6-6 6 6-6 6" fill="none" stroke="#50e0cf" stroke-width="2"/><rect x="610" y="167" width="255" height="78" rx="12" fill="#12243b" stroke="#50e0cf" stroke-opacity="0.6"/><text x="630" y="217" font-size="32" fill="#eaf3ff" font-weight="500">真实分析出图</text><path d="M870 206h15m-6-6 6 6-6 6" fill="none" stroke="#50e0cf" stroke-width="2"/><rect x="890" y="167" width="255" height="78" rx="12" fill="#12243b" stroke="#50e0cf" stroke-opacity="0.6"/><text x="910" y="217" font-size="32" fill="#eaf3ff" font-weight="500">论文审阅稿</text><text x="50" y="307" font-size="27" fill="#9fa7ff" font-weight="650">尚无数据</text><rect x="50" y="327" width="255" height="78" rx="12" fill="#12243b" stroke="#9fa7ff" stroke-opacity="0.6"/><text x="70" y="377" font-size="32" fill="#eaf3ff" font-weight="500">现实条件</text><path d="M310 366h15m-6-6 6 6-6 6" fill="none" stroke="#9fa7ff" stroke-width="2"/><rect x="330" y="327" width="255" height="78" rx="12" fill="#12243b" stroke="#9fa7ff" stroke-opacity="0.6"/><text x="350" y="377" font-size="32" fill="#eaf3ff" font-weight="500">设计与 CRF</text><path d="M590 366h15m-6-6 6 6-6 6" fill="none" stroke="#9fa7ff" stroke-width="2"/><rect x="610" y="327" width="255" height="78" rx="12" fill="#12243b" stroke="#9fa7ff" stroke-opacity="0.6"/><text x="630" y="377" font-size="32" fill="#eaf3ff" font-weight="500">收数并质控</text><path d="M870 366h15m-6-6 6 6-6 6" fill="none" stroke="#9fa7ff" stroke-width="2"/><rect x="890" y="327" width="255" height="78" rx="12" fill="#12243b" stroke="#9fa7ff" stroke-opacity="0.6"/><text x="910" y="377" font-size="32" fill="#eaf3ff" font-weight="500">续接分析成文</text><rect x="50" y="465" width="1100" height="108" rx="12" fill="#152b42" stroke="#31516c"/><text x="74" y="508" font-size="29" fill="#eaf3ff" font-weight="600">确认方案 → 执行与审阅 → 确认稿件版本 / 格式 → 对应版本包</text><text x="74" y="549" font-size="25" fill="#a8bfd5" font-weight="500">阶段产物取决于材料、实际执行能力与必要确认；不代表投稿资格。</text></g></svg>